name: Unzip
on:
  workflow_dispatch:
    inputs:
      zipfile:
        description: "Nama file zip (kosongkan untuk cari otomatis)"
        default: "cocote-pannel-1.0.35-xray-tun.zip"
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    env:
      PAT: ${{ secrets.PAT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Cari zip
        run: |
          ZIP="${{ github.event.inputs.zipfile }}"
          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            ZIP=$(find . -name "*.zip" -not -path "./.git/*" | head -n 1)
          fi
          [ -n "$ZIP" ] || { echo "Zip tidak ditemukan"; exit 1; }
          echo "ZIP=$ZIP" >> $GITHUB_ENV
          echo "Zip terpilih: $ZIP"

      - name: Extract ke root repo
        run: |
          mkdir _tmp
          unzip -o "$ZIP" -d _tmp
          if [ -z "$PAT" ]; then
            echo "PAT_TOKEN kosong, folder .github dilewati"
            rm -rf _tmp/.github
          fi
          if [ "$(ls -A _tmp | wc -l)" -eq 1 ] && [ -d "_tmp/$(ls -A _tmp)" ]; then
            cp -a _tmp/*/. .
          else
            cp -a _tmp/. .
          fi
          rm -rf _tmp
          rm -f "$ZIP"

      - name: Commit dan push
        run: |
          git config user.name
