name: build-cocote-go
on:
  workflow_dispatch:
  push:
    paths: ["go/**", ".github/workflows/build-go.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Vet
        working-directory: go
        run: go vet ./...
      - name: Build amd64 + arm64
        working-directory: go
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p ../bin
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../bin/cocote-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o ../bin/cocote-linux-arm64 .
      - name: Simpan binary ke repo (folder bin/)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/
          git diff --cached --quiet || (git commit -m "build: update binary cocote" && git push)
